<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nova Forma Designs - UK web design &amp; development by Owen Cotter. Clean, responsive, accessible websites tailored to your business."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nova-forma-theme");
          var dark = stored === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.backgroundColor = dark ? "#050c12" : "#f7fcfc";
        } catch (error) {
          document.documentElement.style.backgroundColor = "#f7fcfc";
        }
      })();
    </script>
    <title>Nova Forma Designs | Web Design &amp; Development UK</title>
    <!--
      Static splash for the window between first paint and React booting.
      The coin's size and its 144px offset above centre match the loading
      screen's, so when Loader.tsx removes this the mark keeps spinning in
      place and the progress UI simply assembles around it.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #f7fcfc;
        --boot-ink: #0f2233;
        --boot-accent: #3fd2c6;
        --boot-face: #ffffff;
      }
      :root.dark #boot {
        background: #050c12;
        --boot-ink: #ffffff;
        --boot-face: #0b1924;
      }
      #boot-coin {
        position: absolute;
        top: calc(50% - 144px);
        left: 50%;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        perspective: 1200px;
      }
      #boot-spin {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        animation: boot-spin 2.2s linear infinite;
      }
      #boot-spin > span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border: 2px solid var(--boot-ink);
        border-radius: 9999px;
        background: var(--boot-face);
        box-shadow: 0 8px 0 0 var(--boot-ink);
        backface-visibility: hidden;
      }
      #boot-spin > span + span {
        transform: rotateY(180deg);
      }
      #boot-spin > span + span svg {
        transform: scaleX(-1);
      }
      #boot-spin svg {
        width: 64px;
        height: 64px;
      }
      @keyframes boot-spin {
        to {
          transform: rotateY(360deg);
        }
      }
      @media (min-width: 640px) {
        #boot-coin {
          width: 128px;
          height: 128px;
          margin: -64px 0 0 -64px;
        }
        #boot-spin svg {
          width: 72px;
          height: 72px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-spin {
          animation: none;
        }
      }
    </style>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
