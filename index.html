<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nova Forma Designs - UK web design &amp; development by Owen Cotter. Clean, responsive, accessible websites tailored to your business."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nova-forma-theme");
          var dark = stored === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.backgroundColor = dark ? "#050c12" : "#f7fcfc";
        } catch (error) {
          document.documentElement.style.backgroundColor = "#f7fcfc";
        }
      })();
    </script>
    <title>Nova Forma Designs | Web Design &amp; Development UK</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
